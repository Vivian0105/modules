# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
# # TODO nf-core: Add a description of the module and list keywords
name: "presto_assemblepairs"
description: Assembles paired-end reads into a single sequence
keywords:
  - immcantation
  - airrseq
  - genomics
  - immunoinformatics
tools:
  - "presto":
      description: "A bioinformatics toolkit for processing high-throughput lymphocyte
        receptor sequencing data."
      homepage: "https://presto.readthedocs.io"
      documentation: "https://presto.readthedocs.io"
      tool_dev_url: "https://github.com/immcantation/presto"
      doi: "10.1093/bioinformatics/btu138"
      licence: ["AGPL v3-or-later"]
      identifier: biotools:presto

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - R1_reads:
        type: file
        description: compressed fastq file
        pattern: "*.{fastq.gz}"
        ontologies:
          - edam: "http://edamontology.org/format_1930" # FASTQ
    - R2_reads:
        type: file
        description: compressed fastq file
        pattern: "*.{fastq.gz}"
        ontologies:
          - edam: "http://edamontology.org/format_1930" # FASTQ
output:
  reads:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*_assemble-pass.fastq.gz":
          type: file
          description: assembled fastq.gz file
          pattern: "*.{fastq.gz}"
          ontologies:
            - edam: "http://edamontology.org/format_1930" # FASTQ
  versions_presto:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "presto":
          type: string
          description: The name of the tool
      - AssemblePairs.py --version | grep -o "[0-9][0-9.]*" | head -n 1:
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - presto:
          type: string
          description: The name of the tool
      - AssemblePairs.py --version | grep -o "[0-9][0-9.]*" | head -n 1:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@Vivian0105"
maintainers:
  - "@Vivian0105"
